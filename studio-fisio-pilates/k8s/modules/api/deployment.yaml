apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinica-api
  namespace: clinica
  labels:
    app: clinica-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clinica-api
  template:
    metadata:
      labels:
        app: clinica-api
    spec:
      initContainers:
        - name: aguardar-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h clinica-postgres -U clinica; do sleep 2; done
      containers:
        - name: api
          image: clinica-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: clinica-config
            - secretRef:
                name: clinica-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15