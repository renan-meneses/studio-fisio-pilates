apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinica-ingress
  namespace: clinica
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  rules:
    - host: clinica.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: clinica-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clinica-web
                port:
                  number: 80