apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinica-web
  namespace: clinica
  labels:
    app: clinica-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clinica-web
  template:
    metadata:
      labels:
        app: clinica-web
    spec:
      containers:
        - name: web
          image: clinica-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: API_URL
              value: "http://clinica-api:80/api"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10